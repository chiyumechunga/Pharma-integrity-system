plugins {
    id 'com.gradleup.shadow' version '9.3.1'
    id 'java'
    id 'application'
}

group = 'com.chiyumechunga.chaincode'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.hyperledger.fabric.contract.ContractRouter'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://jitpack.io")
    }
    maven {
        url = uri("https://hyperledger.jfrog.io/hyperledger/fabric-maven")
    }
}

dependencies {
    // Fabric Chaincode
    implementation 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.2'
    annotationProcessor 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.2'

    // JSON Processing
    implementation 'com.owlike:genson:1.6'
    implementation 'org.json:json:20240303'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing - FIXED: Added junit-platform-launcher
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

shadowJar {
    // FIXED: Modern property assignment syntax
    archiveBaseName = 'chaincode'
    archiveVersion = ''
    archiveClassifier = ''

    mergeServiceFiles()

    manifest {
        attributes(
                'Main-Class': 'org.hyperledger.fabric.contract.ContractRouter'
        )
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

test {
    useJUnitPlatform()
    testLogging {
        // FIXED: Assignment syntax for Gradle 9.3+
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "full"
        showStandardStreams = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-Xlint:unchecked',
            '-Xlint:deprecation',
            '-parameters'
    ])
}

// Ensure the shadowJar is built during the standard assemble task
assemble.dependsOn shadowJar

// Force BouncyCastle version consistency
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.bouncycastle') {
            details.useVersion '1.78.1'
        }
    }
}